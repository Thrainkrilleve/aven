apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aven-workload-hpa
  namespace: aven-system
  labels:
    app.kubernetes.io/managed-by: aven
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aven-workload
  minReplicas: 1
  maxReplicas: 50
  metrics:
  - type: External
    external:
      metric:
        name: aven_target_pods
      target:
        type: Value
        averageValue: "1"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 20
        periodSeconds: 30
