# Stage 2: real inference. Four llama.cpp servers (one GGUF each) + four worker adapters
# + the coordinator. Each worker's /infer runs a real completion and reports its wall time.
#
# Point MODELS_DIR at the folder holding red/green/blue/gold/model.gguf, then:
#   MODELS_DIR=C:/Users/attho/ai-hacking-arena/models docker compose -f docker-compose.models.yml up --build
#
# CPU-only: Docker Desktop's VM has no GPU, so this is llama.cpp on CPU (real, just slower than
# the host). Keep context and threads small; all four models together need ~9 GB RAM. To run
# fewer, comment out the stages you don't want (and drop them from the coordinator ROUTE).
name: mesh-sim-models

x-llm: &llm
  image: ghcr.io/ggml-org/llama.cpp:server
  command: ["-m", "/model.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "1024", "-t", "2"]
  restart: unless-stopped

x-worker: &worker
  build: ./worker

services:
  llm-red:
    <<: *llm
    volumes: ["${MODELS_DIR:-C:/Users/attho/ai-hacking-arena/models}/red/model.gguf:/model.gguf:ro"]
  llm-green:
    <<: *llm
    volumes: ["${MODELS_DIR:-C:/Users/attho/ai-hacking-arena/models}/green/model.gguf:/model.gguf:ro"]
  llm-blue:
    <<: *llm
    volumes: ["${MODELS_DIR:-C:/Users/attho/ai-hacking-arena/models}/blue/model.gguf:/model.gguf:ro"]
  llm-gold:
    <<: *llm
    volumes: ["${MODELS_DIR:-C:/Users/attho/ai-hacking-arena/models}/gold/model.gguf:/model.gguf:ro"]

  worker-red:
    <<: *worker
    environment: { WORKER_ID: red, LAYERS: "23", LLM_URL: "http://llm-red:8080", N_PREDICT: "8" }
    depends_on: [llm-red]
  worker-green:
    <<: *worker
    environment: { WORKER_ID: green, LAYERS: "24", LLM_URL: "http://llm-green:8080", N_PREDICT: "8" }
    depends_on: [llm-green]
  worker-blue:
    <<: *worker
    environment: { WORKER_ID: blue, LAYERS: "24", LLM_URL: "http://llm-blue:8080", N_PREDICT: "8" }
    depends_on: [llm-blue]
  worker-gold:
    <<: *worker
    environment: { WORKER_ID: gold, LAYERS: "23", LLM_URL: "http://llm-gold:8080", N_PREDICT: "8" }
    depends_on: [llm-gold]

  coordinator:
    build: ./coordinator
    environment:
      ROUTE: "http://worker-red:8000,http://worker-green:8000,http://worker-blue:8000,http://worker-gold:8000"
      USER_KEY: dev-user-key
      PLANNED_TPS: "4.9"
      POLL_EVERY: "2.0"
    ports: ["8080:8080"]
    depends_on: [worker-red, worker-green, worker-blue, worker-gold]
