[package]
name = "aven-orchestrator"
version = "0.9.0"
description = "Aven Relational Orchestrator"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
avenc = { path = "../../.." }

[features]
custom-protocol = ["tauri/custom-protocol"]
