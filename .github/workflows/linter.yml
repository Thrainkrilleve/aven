name: Linter & Code Quality

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  rust-linter:
    name: Rustfmt & Strict Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo Format Check
        run: cargo fmt --check

      - name: Clippy Linter (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

  c99-linter:
    name: Emitted C99 Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Compilers
        run: sudo apt-get update && sudo apt-get install -y gcc clang

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build avenc Release
        run: cargo build --release

      - name: Emit C99 Artifacts
        run: |
          ./target/release/avenc build examples/server_capacity.aven --emit-c --traceable --checked-c > /tmp/server_capacity.c

      - name: Strict C99 Compilation & Static Analysis
        run: |
          gcc -std=c99 -Wall -Wextra -Wpedantic -Werror -Wconversion \
            -c /tmp/server_capacity.c -o /tmp/server_capacity.o

  aven-model-linter:
    name: Aven Relational Model Validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build avenc Release
        run: cargo build --release

      - name: Validate All Aven Models
        run: |
          for file in examples/*.aven benchmarks/rhel_llm/*.aven; do
            if [ -f "$file" ]; then
              echo "Validating Aven model: $file"
              ./target/release/avenc run "$file" || exit 1
            fi
          done
