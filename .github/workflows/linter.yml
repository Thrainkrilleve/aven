name: Linter & Code Quality

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  linter:
    name: Code Quality & Model Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update && $SUDO apt-get install -y --no-install-recommends curl ca-certificates build-essential gcc clang

      - name: Install Rust Toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV
          export PATH="$HOME/.cargo/bin:$PATH"
          # rust-toolchain.toml in the repo root is the compiler pin.
          rustup show active-toolchain
          rustup component add rustfmt clippy

      - name: Cargo Format Check
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo fmt --check

      - name: Clippy Linter (-D warnings)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo clippy --all-targets -- -D warnings

      - name: Build avenc Release
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release

      - name: Strict C99 Compilation & Static Analysis
        run: |
          ./target/release/avenc build examples/server_capacity.aven --emit-c --traceable --checked-c > /tmp/server_capacity.c
          gcc -std=c99 -Wall -Wextra -Wpedantic -Werror -Wconversion \
            -c /tmp/server_capacity.c -o /tmp/server_capacity.o

      - name: Validate All Aven Models
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          for file in examples/*.aven benchmarks/rhel_llm/*.aven; do
            if [ -f "$file" ]; then
              echo "Validating Aven model: $file"
              case "$file" in
                */storage_cluster.aven)
                  # Intentional under-determination demo (see its header): avenc
                  # must DETECT it (non-zero exit) and name the free variables,
                  # not settle it. Treat a clean settle as the failure here.
                  if ./target/release/avenc run "$file" > /tmp/sc_validate.out 2>&1; then
                    echo "ERROR: $file was expected to be under-determined but settled"
                    exit 1
                  fi
                  grep -q "UNDER-DETERMINED SYSTEM" /tmp/sc_validate.out || {
                    echo "ERROR: $file did not emit the under-determination diagnostic"
                    cat /tmp/sc_validate.out
                    exit 1
                  }
                  echo "  (expected under-determined; diagnostic emitted — OK)"
                  ;;
                *)
                  ./target/release/avenc run "$file" || exit 1
                  ;;
              esac
            fi
          done
