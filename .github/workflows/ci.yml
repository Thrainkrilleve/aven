name: CI/CD Pipeline — Tests & Core Verification

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Numerical Solver & Release Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update && $SUDO apt-get install -y --no-install-recommends curl ca-certificates build-essential gcc z3 python3

      - name: Install Rust Toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV
          export PATH="$HOME/.cargo/bin:$PATH"
          # rust-toolchain.toml in the repo root is the compiler pin.
          rustup show active-toolchain
          rustup component add rustfmt clippy

      - name: Execute Full Test Suite
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --release --verbose

      - name: Compile Release Binary
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release

      - name: Run Multi-Pillar Core Demo
        run: ./target/release/avenc demo

      - name: Check Documentation Against the Compiler
        run: python3 scripts/check_docs.py
