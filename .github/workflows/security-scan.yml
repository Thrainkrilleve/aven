name: Security Audit & Binary Hardening

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  security-audit:
    name: Binary ELF Hardening & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update && $SUDO apt-get install -y --no-install-recommends curl ca-certificates build-essential gcc clang checksec clamav || true

      - name: Install Rust Toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV
          export PATH="$HOME/.cargo/bin:$PATH"
          # rust-toolchain.toml in the repo root is the compiler pin.
          rustup show active-toolchain
          rustup component add rustfmt clippy

      - name: Build avenc Compiler
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release

      - name: Verify Zero Dependency Footprint
        run: |
          echo "Checking Cargo.lock dependencies (zero third-party crate policy)..."
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo tree

      - name: Compile Hardened C99 Artifact & Audit Flags
        run: |
          ./target/release/avenc build examples/server_capacity.aven --emit-c --traceable --checked-c > /tmp/server_capacity.c
          gcc -std=c99 -O2 \
            -Wall -Wextra -Werror \
            -fstack-protector-strong \
            -fstack-clash-protection \
            -fcf-protection=full \
            -D_FORTIFY_SOURCE=2 \
            -fPIE -pie \
            -Wl,-z,relro,-z,now \
            /tmp/server_capacity.c \
            -o /tmp/server_capacity_hardened -lm
          if command -v checksec >/dev/null 2>&1; then
            checksec --file=/tmp/server_capacity_hardened
          fi
          /tmp/server_capacity_hardened

      - name: Filesystem Antivirus Scan
        run: |
          if command -v clamscan >/dev/null 2>&1; then
            clamscan -r -i --exclude-dir="^./target" --exclude-dir="^./.git" . || true
          else
            echo "clamscan not installed, skipping scan"
          fi
