# /etc/tuned/aven-deterministic/tuned.conf — RHEL 9 Performance Tuning Profile
#
# Configured based on Aven non-linear solver outputs:
# - Target CPU frequency: 3.0 GHz (eliminates DVFS jitter)
# - Target throughput: 50,000 req/sec at 25.6 Gbps

[main]
summary=Deterministic Low-Latency Profile for Aven Workloads
include=throughput-performance

[cpu]
governor=performance
energy_perf_bias=performance
min_perf_pct=100
scaling_min_freq=3000000
scaling_max_freq=3000000
force_latency=cstate.id:1

[sysctl]
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.core.netdev_max_backlog = 65535
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
fs.file-max = 2097152
fs.nr_open = 2097152
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_tw_reuse = 1

[vm]
transparent_hugepages=always
